spring.application.name=smart-city-system

# SQLite datasource
spring.datasource.url=jdbc:sqlite:smartcity.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

smartcity.rules.traffic-threshold=80


#Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=SmartCitySystem
info.app.description=IoT ingest + rule-based alerts + JWT + DigiBank + Docker + Swagger
info.app.version=0.0.1


app.jwt.secret=CHANGE_ME_SUPER_SECRET_123456789_CHANGE_ME_SUPER_SECRET
app.jwt.ttlMinutes=120

logging.level.org.springframework.security=DEBUG
